apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.bp.name }}-topology
  namespace: {{ .Values.namespace }}
data:
  # Prefer one localRoots group per relay (hotValency: 1) so each peer stays hot.
  # Same-LAN relays should use LAN IP + the real listen port (not public DNS/NAT).
  topology.json: |
    {
      "bootstrapPeers": [],
      "localRoots": [
        {
          "accessPoints": [
            {
              "address": "192.168.2.138",
              "port": 6007,
              "name": "preprod2-relay-main2-lan"
            }
          ],
          "advertise": false,
          "trustable": true,
          "hotValency": 1
        },
        {
          "accessPoints": [
            {
              "address": "192.168.2.135",
              "port": 6007,
              "name": "preprod1-relay-main3-lan"
            }
          ],
          "advertise": false,
          "trustable": true,
          "hotValency": 1
        },
        {
          "accessPoints": [
            {
              "address": "preprod3.example.com",
              "port": 4001,
              "name": "preprod3-relay-remote"
            }
          ],
          "advertise": false,
          "trustable": true,
          "hotValency": 1
        }
      ],
      "publicRoots": [],
      "useLedgerAfterSlot": -1,
      "peerSharing": false
    }
